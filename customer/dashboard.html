<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – SmartSlot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/env.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/app.js"></script>
</head>
<body class="invisible">
  <header id="nav" class="sticky top-0 z-40 bg-cream/80 backdrop-blur border-b border-sand"></header>
  <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">
    <div>
      <h1 id="hi" class="text-3xl font-bold"></h1>
      <p class="text-sm opacity-70">Ringkasan booking Anda.</p>
    </div>
    <div id="stats" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-2xl font-bold">Booking Mendatang</h2>
        <a href="bookings.html" class="text-sm underline">Lihat semua</a>
      </div>
      <div id="up" class="space-y-3"></div>
    </section>
  </main>
  <script>
    (async () => {
      const p = await guard('customer');
      mountNav('customer');
      $('#hi').textContent = 'Halo, ' + p.name;
      const { data } = await sb.from('bookings').select('*, services(name)').order('booking_date').order('start_time');
      const list = data || [];
      const n = (s) => list.filter((b) => b.status === s).length;
      $('#stats').innerHTML = [['Total Booking', list.length], ['Menunggu', n('pending')], ['Disetujui', n('approved')]]
        .map(([t, v]) => `<div class="card"><p class="text-sm opacity-70">${t}</p><p class="font-display text-4xl font-bold">${v}</p></div>`).join('');
      const up = list.filter((b) => b.booking_date >= today() && ['pending', 'approved'].includes(b.status)).slice(0, 5);
      $('#up').innerHTML = up.map((b) => `
        <div class="card flex items-center justify-between gap-3 flex-wrap">
          <div>
            <p class="font-semibold">${esc(b.services?.name)}</p>
            <p class="text-sm opacity-70">${fd(b.booking_date)} &middot; ${hm(b.start_time)}-${hm(b.end_time)}</p>
          </div>
          ${badge(b.status)}
        </div>`).join('') || '<p class="text-sm opacity-70">Belum ada booking mendatang.</p>';
    })();
  </script>
</body>
</html>
