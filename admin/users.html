<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Admin – SmartSlot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/env.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/app.js"></script>
</head>
<body class="invisible">
  <header id="nav" class="sticky top-0 z-40 bg-cream/80 backdrop-blur border-b border-sand"></header>
  <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <div>
        <h1 class="text-3xl font-bold">Kelola Admin</h1>
        <p class="text-sm opacity-70">Buat akun admin, hapus akun, atau reset password menjadi <b>password</b>.</p>
      </div>
      <button class="btn btn-primary" onclick="addAdmin()"><img src="../assets/icons/add.png" alt="tambah" class="w-4 h-4"> Tambah Admin</button>
    </div>

    <div id="stats" class="grid grid-cols-3 gap-4"></div>

    <section class="card">
      <div class="mb-4">
        <input id="q" class="input" placeholder="Cari nama, email, atau no. HP" oninput="render()">
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead><tr><th>Akun</th><th>No. HP</th><th>Role</th><th>Login terakhir</th><th>Dibuat</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    let users = [];

    (async () => {
      await guard('grand');
      mountNav();
      load();
    })();

    async function load() {
      const { data, error } = await sb.rpc('admin_list');
      if (error) return toast(error.message, false);
      users = data || [];
      render();
    }

    const fdt = (d) => d
      ? new Date(d).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
      : 'Belum pernah';

    const roleBadge = (u) => u.is_grand_admin
      ? '<span class="px-3 py-1 rounded-full text-xs bg-wine text-cream">Grand Admin</span>'
      : '<span class="px-3 py-1 rounded-full text-xs bg-wine/15 text-wine">Admin</span>';

    function render() {
      const q = $('#q').value.trim().toLowerCase();
      const count = (fn) => users.filter(fn).length;
      $('#stats').innerHTML = [
        ['Total Admin', users.length],
        ['Grand Admin', count((u) => u.is_grand_admin)],
        ['Admin Biasa', count((u) => !u.is_grand_admin)],
      ].map(([t, v]) => `<div class="card"><p class="text-sm opacity-70">${t}</p><p class="font-display text-4xl font-bold">${v}</p></div>`).join('');

      const list = users.filter((u) => !q || [u.name, u.email, u.phone].some((x) => (x || '').toLowerCase().includes(q)));

      $('#rows').innerHTML = list.map((u) => {
        const action = u.is_grand_admin
          ? `<span class="td-muted">${u.id === ME.id ? 'Akun Anda' : 'Tidak dapat diubah'}</span>`
          : `<button class="btn btn-soft" onclick="resetPw('${u.id}')">Reset Password</button>
             <button class="btn btn-danger" onclick="delAdmin('${u.id}')">${ico('delete')}</button>`;
        return `<tr>
          <td>
            <p class="font-medium td-wrap">${esc(u.name)}${u.id === ME.id ? ' (Anda)' : ''}</p>
            <p class="td-muted">${esc(u.email)}</p>
          </td>
          <td class="td-wrap">${esc(u.phone) || '-'}</td>
          <td>${roleBadge(u)}</td>
          <td class="td-muted">${fdt(u.last_sign_in_at)}</td>
          <td class="td-muted">${fd(u.created_at.slice(0, 10))}</td>
          <td class="td-actions">${action}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="6" class="py-5 text-center opacity-50 text-sm">Tidak ada akun.</td></tr>';
    }

    function addAdmin() {
      formModal({
        title: 'Tambah Admin',
        fields: [
          { name: 'name', label: 'Nama' },
          { name: 'email', label: 'Email', type: 'email' },
          { name: 'phone', label: 'No. HP (opsional)', type: 'tel', required: false },
          { name: 'password', label: 'Password awal (min. 6 karakter)', type: 'text' },
        ],
        onSubmit: async (v) => {
          if ((v.password || '').length < 6) { toast('Password minimal 6 karakter', false); return false; }
          const { error } = await sb.rpc('admin_create', {
            p_email: v.email.trim(),
            p_name: v.name.trim(),
            p_phone: v.phone.trim() || null,
            p_password: v.password,
          });
          if (error) { toast(error.message, false); return false; }
          toast('Admin berhasil dibuat');
          load();
        },
      });
    }

    async function resetPw(id) {
      const u = users.find((x) => x.id === id);
      if (!confirm(`Reset password "${u.name}" menjadi "password"?`)) return;
      const { error } = await sb.rpc('admin_reset_password', { p_user: id });
      if (error) return toast(error.message, false);
      toast('Password direset menjadi "password"');
    }

    async function delAdmin(id) {
      const u = users.find((x) => x.id === id);
      if (!confirm(`Hapus akun admin "${u.name}"? Tindakan ini tidak bisa dibatalkan.`)) return;
      const { error } = await sb.rpc('admin_delete', { p_user: id });
      if (error) return toast(error.message, false);
      toast('Akun admin dihapus');
      load();
    }
  </script>
</body>
</html>
