<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk – SmartSlot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js"></script>
</head>
<body class="invisible min-h-screen flex items-center justify-center p-4">
  <form id="f" class="card w-full max-w-md space-y-4 p-8">
    <h1 class="text-3xl font-bold text-center">Selamat Datang</h1>
    <div><label class="label">Email</label><input name="email" type="email" class="input" required></div>
    <div><label class="label">Password</label><input name="password" type="password" class="input" required></div>
    <button class="btn btn-primary w-full justify-center">Masuk</button>
    <p class="text-sm text-center">Belum punya akun? <a href="register.html" class="underline">Daftar</a></p>
  </form>
  <script>
    guard('guest');
    $('#f').onsubmit = (e) => {
      e.preventDefault();
      const v = Object.fromEntries(new FormData(e.target));
      doLogin(v.email, v.password, 'customer');
    };
  </script>
</body>
</html>
